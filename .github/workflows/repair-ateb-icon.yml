name: Repair Ateb icon

on:
  push:
    paths:
      - '.github/workflows/repair-ateb-icon.yml'
      - 'apple-touch-icon.png.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decode Ateb icon
        shell: bash
        run: |
          base64 -d apple-touch-icon.png.b64 > apple-touch-icon.png
          cp apple-touch-icon.png icon.png
          file apple-touch-icon.png

      - name: Commit repaired PNG files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon.png
          if git diff --cached --quiet; then
            echo "No icon changes to commit"
            exit 0
          fi
          git commit -m "Repair Ateb Manager PNG icon"
          git push
